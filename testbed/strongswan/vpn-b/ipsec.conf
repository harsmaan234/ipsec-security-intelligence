config setup
    uniqueids=no

conn vpn-b-to-vpn-a
    keyexchange=ikev2
    authby=psk

    left=10.10.10.2
    leftid=@vpn-b
    leftsubnet=10.10.10.2/32

    right=10.10.10.1
    rightid=@vpn-a
    rightsubnet=10.10.10.1/32

    ike=aes256gcm16-prfsha256-modp2048
    esp=aes256gcm16-modp2048

    dpdaction=restart
    dpddelay=30s

    keyingtries=%forever

    auto=start
